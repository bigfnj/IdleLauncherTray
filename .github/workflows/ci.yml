name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Floor for the number of tests that must actually execute. `dotnet test` reports
  # success for a run that discovered nothing, so without this a broken or unreferenced
  # test project would turn CI green by testing zero things.
  MINIMUM_TESTS: 150

jobs:
  build:
    name: Build, Test & Publish Smoke Test
    runs-on: windows-latest

    steps:
      # Actions are pinned to commit SHAs, not tags. A tag is mutable: whoever controls the
      # action repository can repoint v4 at new code, and every workflow picks it up silently
      # on the next run. The trailing comment records which release each SHA was.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore IdleLauncherTray.sln

      - name: Build (Release)
        run: dotnet build IdleLauncherTray.sln --configuration Release --no-restore

      - name: Test
        # Placed before publish on purpose: a failing step fails the job and every later
        # step is skipped, so a red suite means nothing gets published or tagged.
        shell: pwsh
        run: |
          $log = [System.IO.Path]::GetTempFileName()
          dotnet test IdleLauncherTray.sln --configuration Release --no-build | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "dotnet test failed." }

          $summary = Select-String -Path $log -Pattern 'Passed:\s+(\d+)' | Select-Object -First 1
          if (-not $summary) { throw "No dotnet test summary was produced - did any tests run at all?" }

          $passed = [int]$summary.Matches[0].Groups[1].Value
          Write-Host "Tests executed: $passed (minimum $env:MINIMUM_TESTS)"
          if ($passed -lt [int]$env:MINIMUM_TESTS) {
            throw "Only $passed tests ran but at least $env:MINIMUM_TESTS are expected. Tests have been dropped from the run."
          }

      - name: Publish smoke test (single-file, framework-dependent)
        # Verifies the publish profile still produces a single EXE — catches
        # accidental profile breakage before it makes it into a tag.
        # No --no-restore: the publish profile pins RuntimeIdentifier=win-x64
        # which requires its own RID-specific restore separate from the solution restore.
        run: |
          dotnet publish IdleLauncherTray\IdleLauncherTray.csproj `
            -p:PublishProfile=IdleLauncherTray_v2_3_FrameworkDependent_SingleExe

      - name: Confirm single-file output
        shell: pwsh
        run: |
          $outDir = "IdleLauncherTray\bin\Publish\win-x64-framework-dependent-singlefile"
          $files = Get-ChildItem $outDir -File
          Write-Host "Publish output ($($files.Count) file(s)):"
          $files | ForEach-Object { Write-Host "  $($_.Name) — $('{0:N0}' -f $_.Length) bytes" }
          $exe = $files | Where-Object { $_.Name -eq 'IdleLauncherTray.exe' }
          if (-not $exe) { throw "IdleLauncherTray.exe not produced!" }
          # A framework-dependent single-file publish should emit only the EXE
          # (debug symbols are embedded per the profile's <DebugType>embedded</DebugType>).
          if ($files.Count -ne 1) {
            throw "Expected exactly one published file but got $($files.Count). Single-file profile may be broken."
          }
