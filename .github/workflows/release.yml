name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  release:
    name: Build, Publish, and Release
    runs-on: windows-latest
    permissions:
      contents: write   # required to create GitHub Releases on a public repo

    steps:
      # Actions are pinned to commit SHAs, not tags. This job holds `contents: write`, so a
      # mutable tag would let whoever controls the action repository run new code against a
      # token that can write to this repository. The trailing comment records the release.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"          # e.g. v2.3.0
          $ver = $tag.TrimStart('v')               # e.g. 2.3.0
          # AssemblyVersion requires the 4-part Major.Minor.Build.Revision form;
          # FileVersion + Version accept Major.Minor.Patch fine.
          $asmVer = "$ver.0"
          "version=$ver"        | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "assembly=$asmVer"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Tag: $tag | Version: $ver | AssemblyVersion: $asmVer"

      - name: Publish single-file, framework-dependent
        # No separate restore step + no --no-restore: dotnet publish does its own
        # RID-specific restore for win-x64 as pinned by the publish profile.
        shell: pwsh
        run: |
          dotnet publish IdleLauncherTray\IdleLauncherTray.csproj `
            -p:PublishProfile=IdleLauncherTray_v2_3_FrameworkDependent_SingleExe `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:AssemblyVersion=${{ steps.version.outputs.assembly }} `
            -p:FileVersion=${{ steps.version.outputs.assembly }}

      - name: Package release zip
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag     = "${{ github.ref_name }}"
          $pubDir  = "IdleLauncherTray\bin\Publish\win-x64-framework-dependent-singlefile"
          $stage   = "stage\IdleLauncherTray-$tag-win-x64"
          $zipName = "IdleLauncherTray-$tag-win-x64-framework-dependent-singlefile.zip"

          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "$pubDir\IdleLauncherTray.exe" $stage
          Copy-Item README.md  $stage
          Copy-Item LICENSE    $stage
          Compress-Archive -Path "$stage\*" -DestinationPath $zipName

          $zipFile = Get-Item $zipName
          Write-Host "Created $($zipFile.Name) — $('{0:N0}' -f $zipFile.Length) bytes"

          "zip=$zipName"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Compute SHA256
        shell: pwsh
        run: |
          $zip = "${{ steps.package.outputs.zip }}"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -FilePath "$zip.sha256" -Encoding ascii

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: IdleLauncherTray ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256

      # Keep the Releases page to the three most recent builds, matching desktop-ai-companion and
      # runas-helper. The git TAGS are retained (no --cleanup-tag), so any pruned release can be
      # rebuilt from its tag -- deleting the tag would make this irreversible.
      # Best-effort: a prune failure never fails a release that already published.
      #
      # There is deliberately NO `if:` here. This step previously carried
      # `if: steps.version.outputs.is_tag == 'true'`, but the `version` step only ever writes
      # `version` and `assembly` to $GITHUB_OUTPUT -- `is_tag` was never set, so the condition
      # was always '' == 'true' and the step NEVER RAN, silently, for its whole existence.
      # The guard was redundant anyway: this workflow's only trigger is `push: tags: v[0-9]*`,
      # so reaching this step already proves a version tag was pushed. A condition that can
      # never be true is worse than no condition, because it looks like a working control.
      - name: Prune old releases (keep the 3 most recent; tags retained)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $keep = 3
          try {
            $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName,createdAt |
                        ConvertFrom-Json
          } catch { Write-Host "prune: could not list releases: $_"; exit 0 }
          Write-Host "prune: $($releases.Count) release(s) found; keeping the $keep most recent."
          $old = @($releases | Sort-Object { [datetime]$_.createdAt } -Descending | Select-Object -Skip $keep)
          if ($old.Count -eq 0) {
            # Say so out loud. A prune that quietly deletes nothing is indistinguishable from
            # a prune that never ran -- which is exactly the bug this step just came back from.
            Write-Host "prune: nothing to delete (at most $keep releases exist)."
          }
          foreach ($r in $old) {
            Write-Host "Deleting old release $($r.tagName) (git tag kept)"
            gh release delete $r.tagName --repo $env:GITHUB_REPOSITORY --yes
          }
          Write-Host "prune: deleted $($old.Count) release(s); kept the $keep most recent."
